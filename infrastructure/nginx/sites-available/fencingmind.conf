# FencingMind Subdomain Reverse Proxy Configuration
# Domain: fencingmind.ai
# SSL: To be added via certbot/Let's Encrypt

# account.fencingmind.ai -> port 70
server {
    listen 80;
    server_name account.fencingmind.ai;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:70;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

