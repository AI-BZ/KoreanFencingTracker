# FencingMind Subdomain Reverse Proxy Configuration
# Domain: fencingmind.ai
# Traffic: Cloudflare Tunnel → Nginx:9090 → FastAPI services (9070-9076)
# SSL: Cloudflare Edge (client) + Tunnel encryption (origin)
#
# Port 9090 is dedicated to FencingMind (Paperclip keeps 8080).

# fencingmind.ai (root), www, and catch-all -> redirect to data service
# default_server: unknown Host headers (e.g. www, direct IP) also land here
server {
    listen 9090 default_server;
    server_name fencingmind.ai www.fencingmind.ai _;

    location / {
        return 301 https://data.fencingmind.ai$request_uri;
    }
}

# account.fencingmind.ai -> port 9070
server {
    listen 9090;
    server_name account.fencingmind.ai;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:9070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

