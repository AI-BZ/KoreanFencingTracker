# FencingMind Subdomain Reverse Proxy Configuration
# Domain: fencingmind.ai
# Traffic: Cloudflare Tunnel → Nginx:80 → FastAPI services
# SSL: Cloudflare Edge (client) + Tunnel encryption (origin)

# fencingmind.ai (root) -> redirect to data service
server {
    listen 8080;
    server_name fencingmind.ai;

    location / {
        return 301 https://data.fencingmind.ai$request_uri;
    }
}

# account.fencingmind.ai -> port 70
server {
    listen 8080;
    server_name account.fencingmind.ai;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:70;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# data.fencingmind.ai -> port 71
