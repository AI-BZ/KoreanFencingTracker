<!DOCTYPE html>
<html lang="{{ lang|default('ko') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ i18n.auth.error.page_title|default('오류 - FencingMind') }}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    {% if lang|default('ko') == 'ko' %}
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    {% endif %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
        }

        .error-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0f0f1a 100%);
        }
        .error-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 0%, rgba(201, 48, 44, 0.08) 0%, transparent 60%);
        }

        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .error-subtitle {
            color: #b4b4c4;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .error-message-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            color: #ef4444;
            font-size: 0.9rem;
        }

        .error-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c9302c, #a02320);
            color: #fff;
            box-shadow: 0 4px 15px rgba(201, 48, 44, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(201, 48, 44, 0.4);
        }

        .btn-ghost {
            background: transparent;
            color: #b4b4c4;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-ghost:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="error-bg"></div>
    <div class="error-page">
        <div class="error-card">
            <span class="error-icon">&#9888;&#65039;</span>
            <h1 class="error-title">{{ i18n.auth.error.title|default('FencingMind') }}</h1>
            <p class="error-subtitle">{{ i18n.auth.error.subtitle|default('인증 처리 중 문제가 발생했습니다') }}</p>

            <div class="error-message-box">
                {{ error_message }}
            </div>

            <div class="error-buttons">
                <a href="/auth/login" class="btn btn-primary">{{ i18n.auth.error.retry_btn|default('다시 시도') }}</a>
                <a href="/" class="btn btn-ghost">{{ i18n.auth.error.home_btn|default('홈으로') }}</a>
            </div>
        </div>
    </div>
</body>
</html>
