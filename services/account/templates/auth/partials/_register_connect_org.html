<!-- ========== 2. 조건부: 소속 조직 (코치/감독) ========== -->
<section class="form-section conditional" id="orgConnectSection" style="display:none">
    <h2 class="section-title">소속 조직 선택</h2>
    <p class="section-desc">소속 클럽/학교를 검색하여 선택하세요.</p>

    <div class="search-form-row">
        <input type="text" id="orgSearchName" placeholder="조직명 (예: 최병철펜싱클럽)" class="fm-input search-input" style="flex:1;">
        <button type="button" class="fm-btn fm-btn-primary search-btn" onclick="searchOrgs()">검색</button>
    </div>
    <div id="orgSearchResults" class="search-results"></div>
    <div id="orgSelected" class="selected-card" style="display: none;">
        <span class="selected-label">선택된 조직:</span>
        <span id="orgSelectedInfo"></span>
        <button type="button" class="deselect-btn" onclick="deselectOrg()">&times;</button>
    </div>
    <div class="inline-notice notice-info">
        <strong>club.fencingmind.ai(클럽 관리)</strong>를 이용하시려면 <strong>사업자등록증 등 소속 증빙</strong>이 필요합니다.
        증빙 절차는 <strong>가입 후 추후 진행</strong>될 예정이며, 지금은 소속만 선택하시면 됩니다.
    </div>
</section>
