<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FencingMind Account{% endblock %}</title>
    <style>
        :root {
            --primary-color: #3182ce;
            --card-bg: #fff;
            --text-primary: #333;
            --text-secondary: #666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: var(--text-primary);
            line-height: 1.6;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <footer style="text-align:center; padding:24px 16px; margin-top:40px; border-top:1px solid #e2e8f0; font-size:0.8rem; color:#999;">
        <div>
            <a href="/legal/terms" style="color:#666; text-decoration:none;">이용약관</a> |
            <a href="/legal/privacy" style="color:#666; text-decoration:none;">개인정보처리방침</a> |
            <a href="mailto:privacy@fencingmind.ai" style="color:#666; text-decoration:none;">개인정보 문의</a>
        </div>
        <div style="margin-top:4px;">&copy; 2024-2026 FencingMind LLC</div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
