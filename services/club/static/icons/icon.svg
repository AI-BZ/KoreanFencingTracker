<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e04040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9302c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0a0a0f"/>
  <!-- Fencing Epee - diagonal slash -->
  <!-- Blade -->
  <line x1="120" y1="380" x2="360" y2="100" stroke="url(#swordGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Tip -->
  <circle cx="360" cy="100" r="6" fill="#e04040"/>
  <!-- Guard (bell guard) -->
  <ellipse cx="145" cy="358" rx="38" ry="18" fill="none" stroke="#c9302c" stroke-width="6" transform="rotate(-50 145 358)"/>
  <!-- Grip -->
  <line x1="118" y1="382" x2="90" y2="410" stroke="#c9302c" stroke-width="10" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="85" cy="415" r="8" fill="#c9302c"/>
  <!-- FM Text -->
  <text x="310" y="420" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="120" fill="white" opacity="0.95">FM</text>
</svg>
