{% extends "base.html" %}

{% block title %}공지사항 - FencingMind Club{% endblock %}

{% block extra_css %}
<style>
/* ==============================================
   ANNOUNCEMENTS PAGE - Mobile-First Dark Theme
   ============================================== */

.announcements-page {
    padding: 1rem;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

/* --- Header --- */
.ann-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
}

.ann-header-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 1.2rem;
    flex-shrink: 0;
    transition: all 0.2s;
}

.back-btn:hover {
    border-color: var(--border-light);
    color: var(--text-primary);
    background: var(--bg-card-hover);
}

.ann-header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
}

.ann-header h1 .unread-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    background: var(--accent-primary);
    color: #fff;
    border-radius: 11px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-left: 0.5rem;
    vertical-align: middle;
}

.btn-new-ann {
    padding: 0.6rem 1.2rem;
    border-radius: 10px;
    background: var(--accent-primary);
    border: none;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s;
    white-space: nowrap;
}

.btn-new-ann:hover { filter: brightness(1.15); transform: translateY(-1px); }

/* --- Category Filter --- */
.ann-category-tabs {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.25rem;
    -webkit-overflow-scrolling: touch;
}

.ann-category-tab {
    padding: 0.5rem 1rem;
    border-radius: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
}

.ann-category-tab:hover { border-color: var(--border-light); color: var(--text-primary); }
.ann-category-tab.active { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }

/* --- Announcement List --- */
.ann-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.ann-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
}

.ann-card:hover {
    border-color: var(--border-light);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
}

.ann-card.pinned {
    border-color: var(--accent-gold);
    border-width: 1.5px;
}

.ann-card.unread { border-left: 3px solid var(--accent-primary); }

.ann-card-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
}

.ann-pin-icon {
    color: var(--accent-gold);
    font-size: 0.9rem;
}

.ann-badge {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
}

.ann-badge-general { background: var(--info-color); color: #fff; }
.ann-badge-competition { background: var(--accent-primary); color: #fff; }
.ann-badge-schedule { background: var(--success-color); color: #fff; }
.ann-badge-urgent { background: var(--danger-color); color: #fff; animation: pulse-urgent 2s infinite; }

@keyframes pulse-urgent {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.ann-unread-dot {
    width: 8px;
    height: 8px;
    background: var(--accent-primary);
    border-radius: 50%;
    flex-shrink: 0;
}

.ann-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    flex: 1;
}

.ann-card-preview {
    font-size: 0.88rem;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 0.5rem;
}

.ann-card-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.78rem;
    color: var(--text-muted);
}

.ann-card-meta .read-count { display: flex; align-items: center; gap: 0.25rem; }

/* --- Detail Modal --- */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.modal-overlay.active { display: flex; justify-content: center; padding: 1rem; }

.modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    width: 100%;
    max-width: 700px;
    margin: auto;
    overflow: hidden;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-color);
}

.modal-header h2 {
    font-size: 1.15rem;
    color: var(--text-primary);
    flex: 1;
    margin-right: 0.5rem;
}

.modal-close {
    width: 36px;
    height: 36px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.modal-close:hover { color: var(--text-primary); border-color: var(--border-light); }

.modal-body { padding: 1.25rem; }

.detail-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--text-secondary);
}

.detail-content {
    font-size: 0.95rem;
    color: var(--text-primary);
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
}

.detail-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 0.5rem;
}

.detail-read-info {
    font-size: 0.8rem;
    color: var(--text-muted);
}

.detail-actions {
    display: flex;
    gap: 0.5rem;
}

.btn-edit {
    padding: 0.4rem 0.8rem;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.8rem;
}

.btn-edit:hover { border-color: var(--border-light); color: var(--text-primary); }

.btn-delete {
    padding: 0.4rem 0.8rem;
    background: transparent;
    border: 1px solid var(--danger-color);
    border-radius: 6px;
    color: var(--danger-color);
    cursor: pointer;
    font-size: 0.8rem;
}

.btn-delete:hover { background: var(--danger-color); color: #fff; }

/* --- Create/Edit Form Modal --- */
.ann-form {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.form-group { display: flex; flex-direction: column; gap: 0.4rem; }

.form-group label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 500;
}

.form-group input,
.form-group textarea,
.form-group select {
    padding: 0.7rem 0.8rem;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 0.9rem;
    font-family: inherit;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    outline: none;
    border-color: var(--accent-primary);
}

.form-group textarea { resize: vertical; min-height: 150px; }
.form-group select option { background: var(--bg-secondary); color: var(--text-primary); }

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
}

@media (max-width: 500px) {
    .form-row { grid-template-columns: 1fr; }
}

.form-check {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.form-check input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent-primary);
}

.form-check label {
    font-size: 0.9rem;
    color: var(--text-secondary);
    cursor: pointer;
}

.form-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
}

.btn-cancel {
    padding: 0.6rem 1.2rem;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.9rem;
}

.btn-submit {
    padding: 0.6rem 1.2rem;
    background: var(--accent-primary);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
}

.btn-submit:hover { filter: brightness(1.15); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

/* --- Target Roles --- */
.role-checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
}

.role-check {
    display: flex;
    align-items: center;
    gap: 0.3rem;
}

.role-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent-primary);
}

.role-check label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    cursor: pointer;
}

/* --- Empty State --- */
.empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
}

.empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

/* --- Loading --- */
.loading-spinner {
    text-align: center;
    padding: 2rem;
    color: var(--text-secondary);
}

@media (max-width: 500px) {
    .ann-header { flex-direction: column; align-items: flex-start; }
}
</style>
{% endblock %}

{% block content %}
<div class="announcements-page">
    <!-- Header -->
    <div class="ann-header">
        <div class="ann-header-left">
            <a href="/api/club/" class="back-btn">&larr;</a>
            <h1>공지사항 <span class="unread-badge" id="unreadBadge" style="display:none;">0</span></h1>
        </div>
        <button class="btn-new-ann" id="btnNewAnn" style="display:none;" onclick="openCreateModal()">+ 새 공지</button>
    </div>

    <!-- Category Filter -->
    <div class="ann-category-tabs">
        <div class="ann-category-tab active" data-category="" onclick="filterCategory(this)">전체</div>
        <div class="ann-category-tab" data-category="general" onclick="filterCategory(this)">일반</div>
        <div class="ann-category-tab" data-category="competition" onclick="filterCategory(this)">대회</div>
        <div class="ann-category-tab" data-category="schedule" onclick="filterCategory(this)">일정</div>
        <div class="ann-category-tab" data-category="urgent" onclick="filterCategory(this)">긴급</div>
    </div>

    <!-- Announcement List -->
    <div class="ann-list" id="annList">
        <div class="loading-spinner">불러오는 중...</div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="detailTitle">공지 제목</h2>
            <button class="modal-close" onclick="closeDetailModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="detail-meta" id="detailMeta"></div>
            <div class="detail-content" id="detailContent"></div>
            <div class="detail-footer">
                <div class="detail-read-info" id="detailReadInfo"></div>
                <div class="detail-actions" id="detailActionBtns"></div>
            </div>
        </div>
    </div>
</div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="formModal">
    <div class="modal-content" style="max-width:600px;">
        <div class="modal-header">
            <h2 id="formTitle">새 공지사항</h2>
            <button class="modal-close" onclick="closeFormModal()">&times;</button>
        </div>
        <div class="ann-form" id="annForm">
            <div class="form-group">
                <label>제목 *</label>
                <input type="text" id="frmTitle" placeholder="공지 제목">
            </div>
            <div class="form-group">
                <label>내용 *</label>
                <textarea id="frmContent" placeholder="공지 내용을 입력하세요"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>카테고리</label>
                    <select id="frmCategory">
                        <option value="general">일반</option>
                        <option value="competition">대회</option>
                        <option value="schedule">일정</option>
                        <option value="urgent">긴급</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>만료일 (선택)</label>
                    <input type="datetime-local" id="frmExpiresAt">
                </div>
            </div>
            <div class="form-check">
                <input type="checkbox" id="frmPinned">
                <label for="frmPinned">상단 고정</label>
            </div>
            <div class="form-group">
                <label>대상 역할 (미선택 시 전체)</label>
                <div class="role-checkboxes" id="roleCheckboxes">
                    <div class="role-check">
                        <input type="checkbox" id="roleStudent" value="student">
                        <label for="roleStudent">학생</label>
                    </div>
                    <div class="role-check">
                        <input type="checkbox" id="roleParent" value="parent">
                        <label for="roleParent">학부모</label>
                    </div>
                    <div class="role-check">
                        <input type="checkbox" id="roleCoach" value="coach">
                        <label for="roleCoach">코치</label>
                    </div>
                    <div class="role-check">
                        <input type="checkbox" id="roleStaff" value="staff">
                        <label for="roleStaff">스태프</label>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeFormModal()">취소</button>
                <button class="btn-submit" id="btnFormSubmit" onclick="submitForm()">등록</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const API_BASE = '/api/club/announcements';
const params = new URLSearchParams(window.location.search);
const testMode = params.get('test') === '1';

let currentCategory = '';
let editingId = null;

function getHeaders() {
    const h = { 'Content-Type': 'application/json' };
    const token = localStorage.getItem('access_token');
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
}

function apiUrl(path) {
    const base = API_BASE + path;
    const sep = base.includes('?') ? '&' : '?';
    return testMode ? (base + sep + 'test=1') : base;
}

// =============================================
// Unread Count
// =============================================
async function loadUnreadCount() {
    try {
        const res = await fetch(apiUrl('/unread-count'), { headers: getHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        const badge = document.getElementById('unreadBadge');
        if (data.unread_count > 0) {
            badge.textContent = data.unread_count;
            badge.style.display = 'inline-flex';
        } else {
            badge.style.display = 'none';
        }
    } catch (e) {
        console.error('Unread count error:', e);
    }
}

// =============================================
// Announcement List
// =============================================
async function loadAnnouncements() {
    const list = document.getElementById('annList');
    list.innerHTML = '<div class="loading-spinner">불러오는 중...</div>';

    let url = '/?limit=50';
    if (currentCategory) url += '&category=' + currentCategory;

    try {
        const res = await fetch(apiUrl(url), { headers: getHeaders() });
        if (!res.ok) throw new Error('Failed');
        const items = await res.json();

        // Show create button based on first response (indicates auth)
        // Button is always shown; server-side auth controls actual creation
        document.getElementById('btnNewAnn').style.display = '';

        if (items.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📢</div>
                    <p>등록된 공지사항이 없습니다</p>
                </div>`;
            return;
        }

        list.innerHTML = items.map(a => renderAnnCard(a)).join('');
    } catch (e) {
        console.error('Announcements load error:', e);
        list.innerHTML = '<div class="empty-state"><p>공지사항을 불러올 수 없습니다</p></div>';
    }
}

function renderAnnCard(a) {
    const pinIcon = a.is_pinned ? '<span class="ann-pin-icon">📌</span>' : '';
    const unreadDot = !a.is_read ? '<span class="ann-unread-dot"></span>' : '';
    const badgeClass = 'ann-badge-' + (a.category || 'general');
    const catLabel = categoryLabel(a.category || 'general');
    const timeAgo = formatTimeAgo(a.created_at);
    const preview = (a.content || '').substring(0, 150);

    return `
    <div class="ann-card ${a.is_pinned ? 'pinned' : ''} ${!a.is_read ? 'unread' : ''}" onclick="openDetail('${a.id}')">
        <div class="ann-card-header">
            ${pinIcon}
            <span class="ann-badge ${badgeClass}">${catLabel}</span>
            ${unreadDot}
            <span class="ann-title">${escHtml(a.title)}</span>
        </div>
        <div class="ann-card-preview">${escHtml(preview)}</div>
        <div class="ann-card-meta">
            <span>${escHtml(a.author_name || '관리자')}</span>
            <span>${timeAgo}</span>
            <span class="read-count">👁 ${a.read_count || 0}명 읽음</span>
        </div>
    </div>`;
}

function categoryLabel(cat) {
    const map = { general: '일반', competition: '대회', schedule: '일정', urgent: '긴급' };
    return map[cat] || cat;
}

function filterCategory(el) {
    document.querySelectorAll('.ann-category-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentCategory = el.dataset.category;
    loadAnnouncements();
}

// =============================================
// Detail Modal
// =============================================
async function openDetail(id) {
    document.getElementById('detailModal').classList.add('active');
    document.getElementById('detailContent').textContent = '불러오는 중...';

    try {
        const res = await fetch(apiUrl('/' + id), { headers: getHeaders() });
        if (!res.ok) throw new Error('Failed');
        const a = await res.json();

        document.getElementById('detailTitle').textContent = a.title;

        const catBadge = `<span class="ann-badge ann-badge-${a.category || 'general'}">${categoryLabel(a.category || 'general')}</span>`;
        const pinLabel = a.is_pinned ? '<span class="ann-pin-icon">📌 고정</span>' : '';
        document.getElementById('detailMeta').innerHTML = `
            ${catBadge} ${pinLabel}
            <span>${escHtml(a.author_name || '관리자')}</span>
            <span>${formatDate(a.created_at)}</span>
        `;

        document.getElementById('detailContent').textContent = a.content;
        document.getElementById('detailReadInfo').textContent = `${a.read_count || 0}명이 읽었습니다`;

        // Action buttons (edit/delete)
        document.getElementById('detailActionBtns').innerHTML = `
            <button class="btn-edit" onclick="openEditModal('${a.id}')">수정</button>
            <button class="btn-delete" onclick="deleteAnnouncement('${a.id}')">삭제</button>
        `;

        // Update unread count since we just read it
        loadUnreadCount();
        // Mark as read in the list card
        const card = document.querySelector(`.ann-card[onclick*="${a.id}"]`);
        if (card) {
            card.classList.remove('unread');
            const dot = card.querySelector('.ann-unread-dot');
            if (dot) dot.remove();
        }

    } catch (e) {
        console.error('Detail load error:', e);
        document.getElementById('detailContent').textContent = '공지사항을 불러올 수 없습니다';
    }
}

function closeDetailModal() {
    document.getElementById('detailModal').classList.remove('active');
}

// =============================================
// Create / Edit Modal
// =============================================
function openCreateModal() {
    editingId = null;
    document.getElementById('formTitle').textContent = '새 공지사항';
    document.getElementById('btnFormSubmit').textContent = '등록';
    document.getElementById('frmTitle').value = '';
    document.getElementById('frmContent').value = '';
    document.getElementById('frmCategory').value = 'general';
    document.getElementById('frmExpiresAt').value = '';
    document.getElementById('frmPinned').checked = false;
    document.querySelectorAll('#roleCheckboxes input').forEach(cb => cb.checked = false);
    document.getElementById('formModal').classList.add('active');
}

async function openEditModal(id) {
    closeDetailModal();
    editingId = id;
    document.getElementById('formTitle').textContent = '공지사항 수정';
    document.getElementById('btnFormSubmit').textContent = '수정';

    try {
        const res = await fetch(apiUrl('/' + id), { headers: getHeaders() });
        if (!res.ok) throw new Error('Failed');
        const a = await res.json();

        document.getElementById('frmTitle').value = a.title;
        document.getElementById('frmContent').value = a.content;
        document.getElementById('frmCategory').value = a.category || 'general';
        document.getElementById('frmPinned').checked = a.is_pinned;

        if (a.expires_at) {
            const dt = new Date(a.expires_at);
            document.getElementById('frmExpiresAt').value = dt.toISOString().slice(0, 16);
        } else {
            document.getElementById('frmExpiresAt').value = '';
        }

        // Set role checkboxes
        document.querySelectorAll('#roleCheckboxes input').forEach(cb => {
            cb.checked = (a.target_roles || []).includes(cb.value);
        });

        document.getElementById('formModal').classList.add('active');
    } catch (e) {
        alert('공지사항을 불러올 수 없습니다');
    }
}

function closeFormModal() {
    document.getElementById('formModal').classList.remove('active');
    editingId = null;
}

async function submitForm() {
    const title = document.getElementById('frmTitle').value.trim();
    const content = document.getElementById('frmContent').value.trim();

    if (!title || !content) {
        alert('제목과 내용을 입력하세요');
        return;
    }

    const targetRoles = [];
    document.querySelectorAll('#roleCheckboxes input:checked').forEach(cb => {
        targetRoles.push(cb.value);
    });

    const body = {
        title: title,
        content: content,
        category: document.getElementById('frmCategory').value,
        is_pinned: document.getElementById('frmPinned').checked,
        target_roles: targetRoles.length > 0 ? targetRoles : null,
        expires_at: document.getElementById('frmExpiresAt').value || null,
    };

    const btn = document.getElementById('btnFormSubmit');
    btn.disabled = true;

    try {
        const method = editingId ? 'PUT' : 'POST';
        const url = editingId ? apiUrl('/' + editingId) : apiUrl('/');

        const res = await fetch(url, {
            method: method,
            headers: getHeaders(),
            body: JSON.stringify(body),
        });

        if (res.ok) {
            closeFormModal();
            loadAnnouncements();
            loadUnreadCount();
        } else {
            const err = await res.json();
            alert(err.detail || '저장 실패');
        }
    } catch (e) {
        alert('네트워크 오류');
    }

    btn.disabled = false;
}

async function deleteAnnouncement(id) {
    if (!confirm('공지사항을 삭제하시겠습니까?')) return;

    try {
        const res = await fetch(apiUrl('/' + id), {
            method: 'DELETE',
            headers: getHeaders(),
        });

        if (res.ok) {
            closeDetailModal();
            loadAnnouncements();
            loadUnreadCount();
        } else {
            const err = await res.json();
            alert(err.detail || '삭제 실패');
        }
    } catch (e) {
        alert('네트워크 오류');
    }
}

// =============================================
// Utilities
// =============================================
function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

function formatTimeAgo(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);

    if (diff < 60) return '방금 전';
    if (diff < 3600) return Math.floor(diff / 60) + '분 전';
    if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
    if (diff < 604800) return Math.floor(diff / 86400) + '일 전';

    return d.toLocaleDateString('ko-KR');
}

function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}

// Close modals with Escape
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        closeDetailModal();
        closeFormModal();
    }
});

// Close modals clicking overlay
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
        if (e.target === overlay) {
            closeDetailModal();
            closeFormModal();
        }
    });
});

// =============================================
// Init
// =============================================
loadUnreadCount();
loadAnnouncements();
</script>
{% endblock %}
