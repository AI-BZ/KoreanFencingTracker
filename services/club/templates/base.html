<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- PWA -->
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FM Club">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
    <title>{% block title %}FencingMind Club{% endblock %}</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">

    <!-- Design System: tokens first, then layout, skeleton, toast, then theme & components -->
    <link rel="stylesheet" href="/static/css/tokens.css?v=20250225">
    <link rel="stylesheet" href="/static/css/layout.css?v=20250225">
    <link rel="stylesheet" href="/static/css/skeleton.css?v=20250225">
    <link rel="stylesheet" href="/static/css/toast.css?v=20250225">
    <link rel="stylesheet" href="/static/css/dark-theme.css?v=20250225">
    <link rel="stylesheet" href="/static/css/components.css?v=20250225">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <span class="logo-icon">&#9876;&#65039;</span>
                <span class="logo-text">FencingMind Club</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="/api/club/">대시보드</a>
                <a href="/api/club/checkin">체크인</a>
                <a href="/api/club/lessons-page">레슨</a>
                <a href="/api/schedule/page">스케줄</a>
                <a href="/api/club/videos" class="desktop-only">영상</a>
                <a href="/api/club/announcements-page" class="desktop-only">공지</a>
                <a href="#" id="navLogout" style="display:none;" onclick="handleLogout()">로그아웃</a>
            </div>
            <div class="nav-actions">
                <a href="/auth/login" class="nav-login-btn" id="navLoginBtn" style="color:#e2e8f0; text-decoration:none; padding:0.5rem 1rem; border-radius:8px; font-size:0.9rem; border:1px solid rgba(255,255,255,0.15);">로그인</a>
                <button class="nav-notification-btn" id="navNotificationBtn" aria-label="알림" title="알림" style="display:none;">
                    &#128276;
                    <span class="nav-notification-badge" id="navNotifBadge" style="display:none;"></span>
                </button>
                <div class="nav-profile-dropdown" id="navProfileDropdown" style="display:none;">
                    <button class="nav-profile-btn" id="navProfileBtn" aria-label="프로필 메뉴">
                        <span class="nav-profile-avatar" id="navProfileAvatar">?</span>
                        <span class="nav-profile-name" id="navProfileName"></span>
                    </button>
                    <div class="nav-profile-menu" id="navProfileMenu">
                        <a href="/api/club/" class="nav-profile-menu-item">&#127968; 대시보드</a>
                        <a href="/api/club/notifications" class="nav-profile-menu-item">&#128276; 알림 설정</a>
                        <div class="nav-profile-menu-divider"></div>
                        <a href="#" class="nav-profile-menu-item" onclick="handleLogout(); return false;">&#128682; 로그아웃</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav" aria-label="모바일 내비게이션">
        <div class="bottom-nav-inner">
            <a href="/api/club/" class="bottom-nav-item" data-page="home">
                <span class="bottom-nav-icon">&#127968;</span>
                <span class="bottom-nav-label">홈</span>
            </a>
            <a href="/api/club/checkin" class="bottom-nav-item" data-page="checkin">
                <span class="bottom-nav-icon">&#9989;</span>
                <span class="bottom-nav-label">체크인</span>
            </a>
            <a href="/api/club/lessons-page" class="bottom-nav-item" data-page="lessons">
                <span class="bottom-nav-icon">&#128203;</span>
                <span class="bottom-nav-label">레슨</span>
            </a>
            <a href="/api/club/videos" class="bottom-nav-item" data-page="videos">
                <span class="bottom-nav-icon">&#127916;</span>
                <span class="bottom-nav-label">영상</span>
            </a>
            <a href="/api/club/announcements-page" class="bottom-nav-item" data-page="more">
                <span class="bottom-nav-icon">&#128226;</span>
                <span class="bottom-nav-label">공지</span>
            </a>
        </div>
    </nav>

    <footer class="footer">
        <div class="container">
            <p>FencingMind Club Management &copy; 2024-2026</p>
        </div>
    </footer>

    <!-- Kakao SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
            integrity="sha384-DKYJZ8NLiK8MN4/C5P2ezmFnFQl/d2yOG7loRK3wuy06TZRlkU5TPmMGXlmEputS"
            crossorigin="anonymous"></script>
    <script src="/static/js/kakao-share.js"></script>

    <!-- Design System JS -->
    <script src="/static/js/skeleton.js?v=20250225"></script>
    <script src="/static/js/toast.js?v=20250225"></script>

    {% block extra_js %}{% endblock %}
    <script>
    // =========================================================
    // Auth state: read JWT cookie (not localStorage)
    // =========================================================
    (function() {
        function getCookie(name) {
            var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        function parseJWT(token) {
            try {
                return JSON.parse(atob(token.split('.')[1]));
            } catch(e) { return null; }
        }

        var token = getCookie('access_token');
        var payload = token ? parseJWT(token) : null;
        var logoutLink = document.getElementById('navLogout');
        var loginBtn = document.getElementById('navLoginBtn');
        var profileName = document.getElementById('navProfileName');
        var profileAvatar = document.getElementById('navProfileAvatar');
        var profileDropdown = document.getElementById('navProfileDropdown');
        var notificationBtn = document.getElementById('navNotificationBtn');

        if (payload && payload.member_id) {
            // Logged in
            if (logoutLink) logoutLink.style.display = '';
            if (loginBtn) loginBtn.style.display = 'none';
            if (notificationBtn) notificationBtn.style.display = '';
            if (profileDropdown) profileDropdown.style.display = '';

            // Fetch member info from /auth/me (JWT payload may not have name)
            fetch('/auth/me')
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(data) {
                    if (!data) return;
                    var name = data.full_name || data.email || '';
                    if (profileName && name) profileName.textContent = name;
                    if (profileAvatar && name) profileAvatar.textContent = name.charAt(0).toUpperCase();
                })
                .catch(function() {});
        } else {
            // Not logged in — show login button, hide profile
            if (logoutLink) logoutLink.style.display = 'none';
            if (loginBtn) loginBtn.style.display = '';
            if (notificationBtn) notificationBtn.style.display = 'none';
            if (profileDropdown) profileDropdown.style.display = 'none';
        }
    })();

    function handleLogout() {
        // Clear local tokens
        localStorage.removeItem('access_token');
        document.cookie = 'access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        // Redirect to account service logout
        window.location.href = '/auth/logout';
    }

    // =========================================================
    // Profile dropdown toggle
    // =========================================================
    (function() {
        var btn = document.getElementById('navProfileBtn');
        var menu = document.getElementById('navProfileMenu');
        if (!btn || !menu) return;

        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            menu.classList.toggle('open');
        });

        document.addEventListener('click', function() {
            menu.classList.remove('open');
        });
    })();

    // =========================================================
    // Bottom nav: highlight active item based on current URL
    // =========================================================
    (function() {
        var path = window.location.pathname;
        var items = document.querySelectorAll('.bottom-nav-item');
        var navLinks = document.querySelectorAll('#navLinks a');

        // URL matching rules
        var matchRules = {
            'home': ['/api/club/', '/api/club'],
            'checkin': ['/api/club/checkin'],
            'lessons': ['/api/club/lessons', '/api/schedule'],
            'videos': ['/api/club/videos'],
            'more': ['/api/club/announcements']
        };

        // Bottom nav
        items.forEach(function(item) {
            var page = item.getAttribute('data-page');
            var patterns = matchRules[page] || [];
            var isActive = patterns.some(function(p) {
                return path === p || path.startsWith(p + '/') || path.startsWith(p + '?');
            });

            // Special case: exact match for home to avoid matching sub-routes
            if (page === 'home') {
                isActive = (path === '/api/club/' || path === '/api/club');
            }

            if (isActive) {
                item.classList.add('active');
            }
        });

        // Desktop top nav links
        navLinks.forEach(function(link) {
            var href = link.getAttribute('href');
            if (!href || href === '#') return;
            if (path === href || (href !== '/' && path.startsWith(href))) {
                link.style.color = 'var(--text-primary)';
                link.style.background = 'rgba(255, 255, 255, 0.05)';
                link.style.borderColor = 'var(--border-light)';
            }
        });
    })();

    // =========================================================
    // Service Worker
    // =========================================================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) { console.log('SW registered:', reg.scope); })
                .catch(function(err) { console.warn('SW failed:', err); });
        });
    }
    </script>
</body>
</html>
