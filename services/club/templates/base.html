<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA -->
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FM Club">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
    <title>{% block title %}FencingMind Club{% endblock %}</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/dark-theme.css?v=20250222">
    <link rel="stylesheet" href="/static/css/components.css?v=20250222">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <span class="logo-icon">&#9876;&#65039;</span>
                <span class="logo-text">FencingMind Club</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="/api/club/">대시보드</a>
                <a href="/api/club/checkin">체크인</a>
                <a href="/api/club/lessons-page">레슨</a>
                <a href="/api/schedule/page">스케줄</a>
                <a href="#" id="navLogout" style="display:none;" onclick="handleLogout()">로그아웃</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>FencingMind Club Management &copy; 2024-2026</p>
        </div>
    </footer>

    <!-- Kakao SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
            integrity="sha384-DKYJZ8NLiK8MN4/C5P2ezmFnFQl/d2yOG7loRK3wuy06TZRlkU5TPmMGXlmEputS"
            crossorigin="anonymous"></script>
    <script src="/static/js/kakao-share.js"></script>

    {% block extra_js %}{% endblock %}
    <script>
    // Auth state: show/hide logout link
    (function() {
        const token = localStorage.getItem('access_token');
        const logoutLink = document.getElementById('navLogout');
        if (token && logoutLink) {
            logoutLink.style.display = '';
        }
    })();

    function handleLogout() {
        localStorage.removeItem('access_token');
        document.cookie = 'access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        window.location.href = '/';
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.warn('SW failed:', err));
        });
    }
    </script>
</body>
</html>
