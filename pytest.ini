[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --import-mode=importlib: 모노레포에서 여러 서비스가 로컬 패키지명 `app`을 공유하므로
# 기본(prepend) 모드는 네임스페이스 충돌로 test 수집이 깨진다. importlib 모드가 이를 해소.
addopts = -v --tb=short --import-mode=importlib
markers =
    e2e: End-to-end tests requiring running server
    slow: Slow running tests
